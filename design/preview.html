<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网络运维工具箱 · UI 设计稿 v0.2</title>
<style>
/* ============================================================
   Network Toolkit · UI Design System — Semantic Tokens
   与同目录 tokens.css 完全一致（此处内联，保证单文件可直接预览）
   ============================================================ */
:root, [data-theme="dark"] {
  color-scheme: dark;
  --bg-app:#0a1120; --bg-panel:#0f1a2d; --bg-surface:#142138;
  --bg-elevated:#1a2b46; --bg-hover:#20334f; --bg-active:#263c5c;
  --bg-inset:#0c1627; --bg-grid:rgba(148,180,220,.035);
  --border:#243753; --border-strong:#33507a; --border-focus:#22d3ee;
  --text-primary:#edf3fb; --text-secondary:#a8bad2; --text-muted:#7b8fac;
  --text-on-brand:#04121c; --text-on-danger:#1a0a0a;
  --brand:#22d3ee; --brand-hover:#67e8f9; --brand-soft:rgba(34,211,238,.12);
  --brand-border:rgba(34,211,238,.32); --accent:#7c96ff; --accent-soft:rgba(124,150,255,.14);
  --success:#34d399; --success-soft:rgba(52,211,153,.13); --success-border:rgba(52,211,153,.30);
  --warning:#fbbf24; --warning-soft:rgba(251,191,36,.13); --warning-border:rgba(251,191,36,.30);
  --danger:#f87171; --danger-soft:rgba(248,113,113,.13); --danger-border:rgba(248,113,113,.32);
  --info:#60a5fa; --info-soft:rgba(96,165,250,.13); --info-border:rgba(96,165,250,.30);
  --neutral:#94a3b8; --neutral-soft:rgba(148,163,184,.12);
  --cat-collect:#22d3ee; --cat-parse:#a78bfa; --cat-utility:#60a5fa;
  --cat-check:#fbbf24; --cat-session:#34d399; --cat-demo:#94a3b8;
  --chart-grid:rgba(168,186,210,.12); --chart-axis:#7b8fac;
  --chart-bar:#22d3ee; --chart-bar-alt:#7c96ff; --chart-bad:#f87171; --chart-good:#34d399;
  --shadow-sm:0 1px 2px rgba(0,0,0,.28); --shadow-md:0 6px 18px rgba(0,0,0,.34);
  --shadow-lg:0 18px 48px rgba(0,0,0,.46); --ring-focus:0 0 0 3px rgba(34,211,238,.28);
}
[data-theme="light"] {
  color-scheme: light;
  --bg-app:#f2f6fb; --bg-panel:#fff; --bg-surface:#fff;
  --bg-elevated:#f7fafd; --bg-hover:#eef3f9; --bg-active:#e3ecf7;
  --bg-inset:#f7fafd; --bg-grid:rgba(38,76,124,.028);
  --border:#dce4ef; --border-strong:#c2d0e2; --border-focus:#0891b2;
  --text-primary:#15243b; --text-secondary:#50627d; --text-muted:#6d7f99;
  --text-on-brand:#fff; --text-on-danger:#fff;
  --brand:#0e8ba8; --brand-hover:#0a7490; --brand-soft:rgba(8,145,178,.10);
  --brand-border:rgba(8,145,178,.28); --accent:#4f6bed; --accent-soft:rgba(79,107,237,.10);
  --success:#0b8a61; --success-soft:rgba(14,159,110,.10); --success-border:rgba(14,159,110,.26);
  --warning:#a3600a; --warning-soft:rgba(245,158,11,.13); --warning-border:rgba(217,119,6,.28);
  --danger:#c83232; --danger-soft:rgba(220,38,38,.08); --danger-border:rgba(220,38,38,.26);
  --info:#2563eb; --info-soft:rgba(37,99,235,.09); --info-border:rgba(37,99,235,.24);
  --neutral:#64748b; --neutral-soft:rgba(100,116,139,.10);
  --cat-collect:#0e8ba8; --cat-parse:#7c5cd6; --cat-utility:#2563eb;
  --cat-check:#a3600a; --cat-session:#0b8a61; --cat-demo:#64748b;
  --chart-grid:rgba(21,36,59,.10); --chart-axis:#6d7f99;
  --chart-bar:#0e8ba8; --chart-bar-alt:#4f6bed; --chart-bad:#c83232; --chart-good:#0b8a61;
  --shadow-sm:0 1px 2px rgba(21,36,59,.06); --shadow-md:0 6px 18px rgba(21,36,59,.08);
  --shadow-lg:0 18px 48px rgba(21,36,59,.14); --ring-focus:0 0 0 3px rgba(8,145,178,.22);
}
:root {
  --font-sans:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI","PingFang SC",sans-serif;
  --font-mono:"JetBrains Mono","Cascadia Mono","SFMono-Regular",Consolas,monospace;
  --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px;
  --fs-16:16px; --fs-20:20px; --fs-26:26px; --fs-32:32px;
  --lh-tight:1.25; --lh-base:1.5; --lh-loose:1.7;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-5:20px; --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px;
  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-pill:999px;
  --dur-fast:150ms; --dur-base:260ms; --dur-slow:420ms;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sidebar-w:268px; --appbar-h:58px; --statusbar-h:34px;
}

/* ============================ Base ============================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font-sans);font-size:var(--fs-13);line-height:var(--lh-base);
  color:var(--text-primary);background:var(--bg-app);-webkit-font-smoothing:antialiased;
  transition:background-color var(--dur-base) var(--ease),color var(--dur-base) var(--ease)}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
::selection{background:var(--brand-soft);color:var(--text-primary)}
:focus-visible{outline:none;box-shadow:var(--ring-focus);border-radius:var(--r-sm)}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.ico-sm{width:14px;height:14px}
.ico-lg{width:20px;height:20px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--text-muted)}
.sec{color:var(--text-secondary)}

/* ============================ Shell ============================ */
.app-shell{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.appbar{height:var(--appbar-h);flex:none;display:flex;align-items:center;gap:var(--sp-3);
  padding:0 var(--sp-5);background:var(--bg-panel);border-bottom:1px solid var(--border);z-index:5}
.brand{display:flex;align-items:center;gap:var(--sp-3);flex:none}
.brand-mark{width:34px;height:34px;border-radius:var(--r-md);display:grid;place-items:center;
  background:linear-gradient(145deg,var(--brand-soft),transparent);border:1px solid var(--brand-border);
  color:var(--brand)}
.brand-mark .ico{width:22px;height:22px;stroke-width:1.6}
.brand-txt{display:flex;flex-direction:column;line-height:1.2}
.brand-cn{font-size:var(--fs-14);font-weight:700;letter-spacing:.02em}
.brand-en{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;color:var(--text-muted);margin-top:3px}
.vr{width:1px;height:22px;background:var(--border);flex:none}
.spacer{flex:1}
.global-pill{display:flex;align-items:center;gap:var(--sp-2);height:30px;padding:0 var(--sp-3);
  border-radius:var(--r-pill);background:var(--bg-elevated);border:1px solid var(--border);
  font-size:var(--fs-11);color:var(--text-secondary);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex:none;
  box-shadow:0 0 0 3px var(--success-soft)}
.dot-pulse{animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px var(--success-soft)}50%{box-shadow:0 0 0 6px transparent}}
.icon-btn{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;
  color:var(--text-secondary);border:1px solid transparent;transition:all var(--dur-fast) var(--ease)}
.icon-btn:hover{background:var(--bg-hover);color:var(--text-primary);border-color:var(--border)}
.icon-btn[aria-pressed="true"]{color:var(--brand);background:var(--brand-soft);border-color:var(--brand-border)}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-size:var(--fs-11);font-weight:700;color:var(--text-on-brand);
  background:linear-gradient(135deg,var(--brand),var(--accent))}

.app-body{flex:1;display:flex;min-height:0}
.sidebar{width:var(--sidebar-w);flex:none;display:flex;flex-direction:column;
  background:var(--bg-panel);border-right:1px solid var(--border)}
.sidebar-head{padding:var(--sp-4) var(--sp-3) var(--sp-2)}
.search{position:relative;display:flex;align-items:center}
.search .ico{position:absolute;left:10px;color:var(--text-muted);pointer-events:none}
.search input{width:100%;height:34px;padding:0 34px 0 32px;border-radius:var(--r-sm);
  background:var(--bg-elevated);border:1px solid var(--border);outline:none;font-size:var(--fs-12);
  transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.search input::placeholder{color:var(--text-muted)}
.search input:focus{border-color:var(--border-focus);box-shadow:var(--ring-focus)}
.kbd{position:absolute;right:8px;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);
  border:1px solid var(--border);border-radius:4px;padding:0 5px;line-height:16px;pointer-events:none}
.nav-scroll{flex:1;overflow-y:auto;padding:var(--sp-1) var(--sp-2) var(--sp-4)}
.nav-scroll::-webkit-scrollbar,.workspace::-webkit-scrollbar,.table-wrap::-webkit-scrollbar,
.params-grid::-webkit-scrollbar{width:8px;height:8px}
.nav-scroll::-webkit-scrollbar-thumb,.workspace::-webkit-scrollbar-thumb,
.table-wrap::-webkit-scrollbar-thumb,
.params-grid::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}
.nav-group{margin-top:var(--sp-4)}
.nav-group:first-child{margin-top:var(--sp-2)}
.nav-group-head{display:flex;align-items:center;gap:var(--sp-2);padding:0 var(--sp-2) var(--sp-2);
  font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--text-muted)}
.nav-group-head .bar{width:3px;height:10px;border-radius:2px;background:var(--cat,var(--neutral))}
.nav-count{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--text-muted);
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--r-pill);padding:0 6px}
.nav-item{position:relative;display:flex;align-items:center;gap:10px;width:100%;height:36px;
  padding:0 10px 0 12px;border-radius:var(--r-sm);color:var(--text-secondary);text-align:left;
  transition:background var(--dur-fast),color var(--dur-fast)}
.nav-item::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;
  background:var(--brand);opacity:0;transition:opacity var(--dur-fast)}
.nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav-item.active{background:var(--brand-soft);color:var(--text-primary);font-weight:600}
.nav-item.active::before{opacity:1}
.nav-item .ico{color:var(--cat,var(--text-muted))}
.nav-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-12)}
/* 侧栏版本号已按设计评审移除，整行宽度留给工具名 */
.nav-empty{padding:var(--sp-6) var(--sp-3);text-align:center;color:var(--text-muted);font-size:var(--fs-12)}
.sidebar-foot{flex:none;padding:var(--sp-3) var(--sp-4);border-top:1px solid var(--border);
  display:flex;flex-direction:column;gap:6px;font-size:var(--fs-11);color:var(--text-muted)}
.sidebar-foot .row{display:flex;align-items:center;gap:6px}
.mini-badge{display:inline-flex;align-items:center;gap:5px;color:var(--success)}

.workspace{flex:1;min-width:0;overflow-y:auto;
  padding:var(--sp-4) var(--sp-6) var(--sp-5);
  background-image:linear-gradient(var(--bg-grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);
  background-size:32px 32px}
.workspace-inner{width:100%;max-width:1440px;margin:0 auto}
/* 输出区固定 340px（对齐现有 OUTPUT_MIN_H=340），表格/图表/日志内部滚动；
   上方参数与运行条按自然高度完整显示，保证「开始执行」永不被裁切。
   窗口装不下时整块工作区滚动一次，不做双层嵌套滚动。 */
.upper{display:block}
.output-card{height:340px;min-height:340px;margin-top:var(--sp-3);
  display:flex;flex-direction:column}
.output-card .tabs{flex:none}
.output-card .tab-panel{flex:1;min-height:0;display:flex;flex-direction:column;
  overflow:hidden;padding:var(--sp-4)}
.output-card .tab-panel > .toolbar{flex:none}
.output-card .tab-panel > .table-wrap{flex:1;min-height:110px;max-height:none}
.output-card .tab-panel > .table-foot{flex:none}
.output-card .tab-panel > .chart-grid-wrap{flex:1;min-height:0;overflow:auto}
.output-card .tab-panel > .log-box{flex:1;max-height:none}
.output-card .tab-panel > .summary-grid{flex:1;min-height:0;overflow:auto}
.output-card .tab-panel > .path-box{flex:none}

/* ============================ Head ============================ */
.crumb{display:flex;align-items:center;gap:7px;font-size:var(--fs-11);color:var(--text-muted);margin-bottom:var(--sp-3)}
.crumb .ico{width:12px;height:12px}
.tool-head{display:flex;align-items:flex-start;gap:var(--sp-4);margin-bottom:var(--sp-4)}
.tool-head-main{flex:1;min-width:0}
.title-row{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}
h1{font-size:var(--fs-20);font-weight:700;letter-spacing:-.01em;margin:0;line-height:var(--lh-tight)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:var(--r-pill);
  font-size:var(--fs-11);font-weight:600;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary)}
.chip-cat{color:var(--cat);background:var(--brand-soft);border-color:var(--brand-border);
  background:color-mix(in srgb,var(--cat) 12%,transparent);
  border-color:color-mix(in srgb,var(--cat) 30%,transparent)}
/* 工具头的版本 / ID 徽章已按设计评审移除，只保留分类徽章 */
.tool-desc{margin:8px 0 0;color:var(--text-secondary);font-size:var(--fs-12);line-height:var(--lh-loose);max-width:880px}
.head-actions{display:flex;gap:var(--sp-2);flex:none}

/* ============================ Buttons ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;
  border-radius:var(--r-sm);font-size:var(--fs-12);font-weight:600;white-space:nowrap;
  border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-secondary);
  transition:all var(--dur-fast) var(--ease)}
.btn:hover{background:var(--bg-hover);color:var(--text-primary);border-color:var(--border-strong)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-primary{background:var(--brand);color:var(--text-on-brand);border-color:var(--brand)}
.btn-primary:hover{background:var(--brand-hover);color:var(--text-on-brand);border-color:var(--brand-hover)}
.btn-danger-outline{color:var(--danger);border-color:var(--danger-border);background:var(--danger-soft)}
.btn-danger-outline:hover{background:var(--danger);color:var(--text-on-danger);border-color:var(--danger)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--bg-hover);border-color:transparent}
.btn-sm{height:28px;padding:0 10px;font-size:var(--fs-11)}
.btn-icon{width:30px;padding:0}

/* ============================ KPI ============================ */
.kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-3);margin-bottom:var(--sp-3)}
.kpi{position:relative;overflow:hidden;padding:11px var(--sp-4) 10px;border-radius:var(--r-md);
  background:var(--bg-surface);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--tone,var(--brand));opacity:.85}
.kpi-label{display:flex;align-items:center;gap:6px;font-size:var(--fs-11);color:var(--text-muted)}
.kpi-label .ico{width:13px;height:13px;color:var(--tone,var(--brand))}
.kpi-value{font-family:var(--font-mono);font-size:var(--fs-26);font-weight:700;line-height:1.2;
  margin-top:7px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi-sub{margin-top:2px;font-size:var(--fs-11);color:var(--text-muted)}
.kpi-sub .up{color:var(--danger)} .kpi-sub .down{color:var(--success)}

/* ============================ Cards ============================ */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-md);
  box-shadow:var(--shadow-sm);overflow:hidden}
.card + .card{margin-top:var(--sp-3)}
.card-head{display:flex;align-items:center;gap:var(--sp-2);padding:11px var(--sp-4);
  border-bottom:1px solid var(--border);min-height:44px}
.card-head .ico{color:var(--brand)}
.card-title{font-size:var(--fs-13);font-weight:700}
.card-note{font-size:var(--fs-11);color:var(--text-muted);margin-left:4px}
.card-head .spacer{flex:1}

/* ============================ Params ============================ */
.params-body{max-height:290px;overflow-y:auto;transition:max-height var(--dur-slow) var(--ease)}
.params-body.folded{max-height:0;overflow:hidden}
.params-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-4) var(--sp-6);
  padding:var(--sp-4)}
.field{min-width:0}
.field-label{display:flex;align-items:center;gap:5px;margin-bottom:6px;font-size:var(--fs-12);
  font-weight:600;color:var(--text-secondary)}
.req{color:var(--danger);font-weight:700}
.help-dot{width:13px;height:13px;border-radius:50%;border:1px solid var(--border-strong);
  display:inline-grid;place-items:center;font-family:var(--font-mono);font-size:9px;
  color:var(--text-muted);cursor:help;position:relative}
.help-dot:hover{color:var(--brand);border-color:var(--brand)}
.help-dot .tip{display:none;position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);
  width:230px;padding:9px 11px;border-radius:var(--r-sm);font-size:var(--fs-11);font-weight:400;
  line-height:1.6;color:var(--text-primary);background:var(--bg-elevated);
  border:1px solid var(--border-strong);box-shadow:var(--shadow-md);z-index:20;white-space:normal}
.help-dot:hover .tip,.help-dot:focus .tip{display:block}
.input,.select{width:100%;height:34px;padding:0 10px;border-radius:var(--r-sm);outline:none;
  background:var(--bg-elevated);border:1px solid var(--border);font-size:var(--fs-12);
  transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.input::placeholder{color:var(--text-muted)}
.input:focus,.select:focus{border-color:var(--border-focus);box-shadow:var(--ring-focus)}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-muted) 50%),
  linear-gradient(135deg,var(--text-muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
.input-group{display:flex;gap:6px}
.input-group .input{flex:1;min-width:0}
.field-hint{margin-top:5px;font-size:10px;color:var(--text-muted);display:flex;align-items:center;gap:5px}
.field-hint.ok{color:var(--success)}
.toggle-row{display:flex;align-items:center;gap:10px;height:34px}
.toggle{width:36px;height:20px;border-radius:var(--r-pill);background:var(--bg-active);
  border:1px solid var(--border-strong);position:relative;flex:none;transition:background var(--dur-fast)}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;
  background:var(--text-muted);transition:transform var(--dur-fast) var(--ease),background var(--dur-fast)}
.toggle[aria-checked="true"]{background:var(--brand);border-color:var(--brand)}
.toggle[aria-checked="true"]::after{transform:translateX(16px);background:var(--text-on-brand)}
.toggle-txt{font-size:var(--fs-12);color:var(--text-secondary)}
.sched-bar{display:flex;align-items:center;gap:var(--sp-2);padding:10px var(--sp-4);
  border-top:1px solid var(--border);background:var(--bg-elevated);flex-wrap:wrap}
.sched-bar .label{font-size:var(--fs-11);color:var(--text-muted);display:flex;align-items:center;gap:6px}
.sched-bar .input{width:76px;height:28px;text-align:center;font-family:var(--font-mono)}

/* ============================ Run bar ============================ */
.run-bar{display:flex;align-items:center;gap:var(--sp-2);padding:12px var(--sp-4);
  margin-top:var(--sp-3);border-radius:var(--r-md);background:var(--bg-surface);
  border:1px solid var(--border);box-shadow:var(--shadow-sm);flex-wrap:wrap}
.run-progress{margin-left:auto;display:flex;align-items:center;gap:var(--sp-3);min-width:330px;flex:1;
  justify-content:flex-end}
.progress-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:132px}
.progress-num{font-family:var(--font-mono);font-size:var(--fs-14);font-weight:700}
.progress-item{font-size:10px;color:var(--text-muted);max-width:180px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.track{width:100%;max-width:240px;height:7px;border-radius:var(--r-pill);
  background:var(--bg-inset);border:1px solid var(--border);overflow:hidden;flex:none}
.fill{height:100%;width:0%;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--brand),var(--accent));transition:width var(--dur-fast) linear}

/* ============================ Tabs ============================ */
.tabs{display:flex;align-items:stretch;gap:2px;padding:0 var(--sp-3);border-bottom:1px solid var(--border);
  background:var(--bg-surface);overflow-x:auto}
.tab{display:flex;align-items:center;gap:7px;height:42px;padding:0 var(--sp-3);position:relative;
  font-size:var(--fs-12);font-weight:600;color:var(--text-muted);white-space:nowrap}
.tab:hover{color:var(--text-primary);background:var(--bg-hover)}
.tab[aria-selected="true"]{color:var(--brand)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;
  height:2px;border-radius:2px 2px 0 0;background:var(--brand)}
.tab .ico{width:14px;height:14px}
.tab-count{font-family:var(--font-mono);font-size:10px;padding:0 5px;border-radius:var(--r-pill);
  background:var(--bg-elevated);border:1px solid var(--border);line-height:16px;color:var(--text-muted)}
.tab-panel{padding:var(--sp-4);min-height:300px}

/* ============================ Toolbar / Table ============================ */
.toolbar{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3);flex-wrap:wrap}
.segmented{display:inline-flex;padding:2px;border-radius:var(--r-sm);background:var(--bg-elevated);
  border:1px solid var(--border)}
.seg{height:26px;padding:0 11px;border-radius:4px;font-size:var(--fs-11);color:var(--text-muted)}
.seg[aria-pressed="true"]{background:var(--bg-active);color:var(--text-primary);font-weight:600}
.mini-search{position:relative;display:flex;align-items:center;width:190px}
.mini-search .ico{position:absolute;left:9px;width:13px;height:13px;color:var(--text-muted)}
.mini-search input{width:100%;height:30px;padding:0 8px 0 28px;border-radius:var(--r-sm);outline:none;
  background:var(--bg-elevated);border:1px solid var(--border);font-size:var(--fs-11)}
.mini-search input:focus{border-color:var(--border-focus);box-shadow:var(--ring-focus)}
.font-ctl{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--bg-elevated);padding:2px}
.font-ctl button{width:24px;height:24px;border-radius:4px;font-family:var(--font-mono);
  font-size:var(--fs-11);color:var(--text-secondary)}
.font-ctl button:hover{background:var(--bg-hover);color:var(--text-primary)}
.font-ctl span{font-size:10px;color:var(--text-muted);padding:0 4px}
.table-wrap{overflow:auto;max-height:330px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--bg-inset)}
table{width:100%;border-collapse:collapse;font-size:var(--table-fs,12.5px)}
thead th{position:sticky;top:0;z-index:2;text-align:left;padding:9px 12px;white-space:nowrap;
  font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-muted);background:var(--bg-elevated);border-bottom:1px solid var(--border)}
thead th.num{text-align:right}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;
  color:var(--text-secondary)}
tbody tr:nth-child(even){background:rgba(127,160,200,.035)}
tbody tr:hover{background:var(--bg-hover)}
tbody tr:last-child td{border-bottom:0}
tbody td.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
tbody tr.fail td:first-child{box-shadow:inset 2px 0 0 var(--danger)}
tbody tr.fail{background:var(--danger-soft)}
.cell-strong{color:var(--text-primary);font-weight:600}
.pos{color:var(--danger);font-weight:600} .neg{color:var(--success);font-weight:600}
.status-chip{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;
  border-radius:var(--r-pill);font-size:10px;font-weight:600;white-space:nowrap}
.status-chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.st-ok{color:var(--success);background:var(--success-soft);border:1px solid var(--success-border)}
.st-partial{color:var(--warning);background:var(--warning-soft);border:1px solid var(--warning-border)}
.st-fail{color:var(--danger);background:var(--danger-soft);border:1px solid var(--danger-border)}
.st-info{color:var(--info);background:var(--info-soft);border:1px solid var(--info-border)}
.st-idle{color:var(--neutral);background:var(--neutral-soft);border:1px solid var(--border)}
.empty-row td{text-align:center;color:var(--text-muted);padding:var(--sp-8)}
.table-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;
  font-size:var(--fs-11);color:var(--text-muted)}

/* ============================ Chart ============================ */
.chart-grid-wrap{display:grid;grid-template-columns:1.45fr 1fr;gap:var(--sp-4)}
.chart-box{border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg-inset);padding:var(--sp-4)}
.chart-title{font-size:var(--fs-12);font-weight:700;margin:0 0 2px}
.chart-sub{font-size:10px;color:var(--text-muted);margin-bottom:var(--sp-4)}
.bar-row{display:grid;grid-template-columns:132px 1fr 78px;align-items:center;gap:10px;margin-bottom:9px}
.bar-label{font-family:var(--font-mono);font-size:10px;color:var(--text-secondary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:16px;border-radius:3px;background:var(--bg-elevated);position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--chart-bar),var(--chart-bar-alt));
  transform-origin:left;animation:grow .7s var(--ease) both}
.bar-fill.bad{background:linear-gradient(90deg,var(--chart-bad),#fbbf24)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.bar-val{font-family:var(--font-mono);font-size:10px;text-align:right;color:var(--text-primary)}
.axis{display:flex;justify-content:space-between;margin-top:var(--sp-3);padding-left:142px;
  font-family:var(--font-mono);font-size:9px;color:var(--chart-axis)}
.axis span{flex:1;text-align:center;border-left:1px solid var(--chart-grid)}
.trend-svg{width:100%;height:132px;display:block}
.legend{display:flex;gap:var(--sp-4);margin-top:var(--sp-3);font-size:10px;color:var(--text-muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.risk-list{display:flex;flex-direction:column;gap:8px;margin-top:var(--sp-4)}
.risk-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);
  background:var(--danger-soft);border:1px solid var(--danger-border)}
.risk-item .ico{color:var(--danger);width:14px;height:14px}
.risk-name{font-family:var(--font-mono);font-size:11px;color:var(--text-primary);flex:1}
.risk-meta{font-size:10px;color:var(--danger);font-weight:600}

/* ============================ Log ============================ */
.log-box{background:var(--bg-inset);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:var(--sp-3);max-height:310px;overflow:auto;font-family:var(--font-mono);font-size:11.5px}
.log-line{display:flex;gap:10px;padding:3px 6px;border-radius:3px;line-height:1.65}
.log-line:hover{background:var(--bg-hover)}
.log-ts{color:var(--text-muted);flex:none}
.log-lvl{flex:none;width:52px;font-weight:700}
.lv-info{color:var(--info)} .lv-warn{color:var(--warning)} .lv-error{color:var(--danger)}
.log-ip{color:var(--accent);flex:none;width:112px}
.log-msg{color:var(--text-secondary);word-break:break-all}
.log-sep{color:var(--brand);margin:5px 0}

/* ============================ Summary ============================ */
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
.summary-block{border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg-inset);
  padding:var(--sp-4)}
.summary-block h3{font-size:var(--fs-12);margin:0 0 var(--sp-3);display:flex;align-items:center;gap:7px}
.summary-block h3 .ico{color:var(--brand);width:14px;height:14px}
.kv{display:flex;justify-content:space-between;gap:var(--sp-4);padding:6px 0;
  border-bottom:1px dashed var(--border);font-size:var(--fs-12)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--text-muted)} .kv .v{color:var(--text-primary);font-weight:600}
.kv .v.mono{font-weight:500}
.reason-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.reason-name{width:118px;font-size:var(--fs-11);color:var(--text-secondary)}
.reason-track{flex:1;height:8px;border-radius:var(--r-pill);background:var(--bg-elevated);overflow:hidden}
.reason-fill{height:100%;border-radius:var(--r-pill);background:var(--danger)}
.reason-num{width:28px;text-align:right;font-family:var(--font-mono);font-size:11px;color:var(--text-primary)}
.path-box{margin-top:var(--sp-3);padding:9px 11px;border-radius:var(--r-sm);background:var(--bg-elevated);
  border:1px solid var(--border);font-family:var(--font-mono);font-size:11px;
  color:var(--text-secondary);word-break:break-all}

/* ============================ Statusbar ============================ */
.statusbar{height:var(--statusbar-h);flex:none;display:flex;align-items:center;gap:var(--sp-3);
  padding:0 var(--sp-5);background:var(--bg-panel);border-top:1px solid var(--border);
  font-size:var(--fs-11);color:var(--text-muted);z-index:5}
.state-badge{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 9px;
  border-radius:var(--r-pill);font-weight:600;font-size:10px}
.sb-idle{color:var(--neutral);background:var(--neutral-soft)}
.sb-run{color:var(--brand);background:var(--brand-soft)}
.sb-ok{color:var(--success);background:var(--success-soft)}
.sb-partial{color:var(--warning);background:var(--warning-soft)}
.sb-fail{color:var(--danger);background:var(--danger-soft)}
.statusbar .mono{color:var(--text-secondary)}

/* ============================ Responsive / Motion ============================ */
@media(max-width:1180px){
  :root{--sidebar-w:232px}
  .kpi-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chart-grid-wrap{grid-template-columns:1fr}
  .run-progress{min-width:240px}
}
@media(max-width:900px){
  .sidebar{display:none}
  .params-grid{grid-template-columns:1fr}
  .summary-grid{grid-template-columns:1fr}
  .global-pill{display:none}
}
@media(max-width:620px){
  .kpi-row{grid-template-columns:1fr 1fr}
  .workspace{padding:var(--sp-4)}
  .head-actions{display:none}
  .run-progress{width:100%;justify-content:flex-start}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>

<div class="app-shell">
  <!-- ============ App bar ============ -->
  <header class="appbar">
    <div class="brand">
      <div class="brand-mark"><svg class="ico"><use href="#i-logo"/></svg></div>
      <div class="brand-txt"><span class="brand-cn">网络运维工具箱</span><span class="brand-en">NETOPS TOOLKIT</span></div>
    </div>
    <div class="spacer"></div>
    <div class="global-pill"><span class="dot dot-pulse"></span>调度器运行中 · 下次 <span class="mono" style="margin-left:4px">08:30</span></div>
    <button class="icon-btn" id="themeBtn" aria-label="切换深浅主题" title="切换深浅主题"><svg class="ico ico-lg" id="themeIcon"><use href="#i-sun"/></svg></button>
    <button class="icon-btn" aria-label="凭证管理" title="凭证管理"><svg class="ico ico-lg"><use href="#i-key"/></svg></button>
    <button class="icon-btn" aria-label="定时任务总览" title="定时任务总览"><svg class="ico ico-lg"><use href="#i-clock"/></svg></button>
    <button class="icon-btn" aria-label="关于" title="关于"><svg class="ico ico-lg"><use href="#i-info"/></svg></button>
    <div class="vr"></div>
    <div class="avatar" title="操作者">OP</div>
  </header>

  <div class="app-body">
    <!-- ============ Sidebar ============ -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="search">
          <svg class="ico"><use href="#i-search"/></svg>
          <input id="navSearch" type="search" placeholder="搜索工具名称或 ID" aria-label="搜索工具">
          <span class="kbd">/</span>
        </div>
      </div>
      <nav class="nav-scroll" id="nav" aria-label="工具导航"></nav>
      <div class="sidebar-foot">
        <div class="row mini-badge"><svg class="ico ico-sm"><use href="#i-check"/></svg><span id="toolCount">12 个工具已注册</span></div>
        <div class="row"><svg class="ico ico-sm"><use href="#i-layers"/></svg><span>插件式注册 · 丢进 tools/ 即可出现</span></div>
        <div class="row"><svg class="ico ico-sm"><use href="#i-info"/></svg><span>F11 全屏 · Ctrl+滚轮 调整字号</span></div>
      </div>
    </aside>

    <!-- ============ Workspace ============ -->
    <main class="workspace">
      <div class="workspace-inner">
        <div class="upper">
        <div class="crumb">
          <svg class="ico"><use href="#i-layers"/></svg><span>工具箱</span>
          <svg class="ico"><use href="#i-chevron-right"/></svg><span id="crumbCat">采集分析类</span>
          <svg class="ico"><use href="#i-chevron-right"/></svg><span id="crumbName" style="color:var(--text-primary)">接口信息采集</span>
        </div>

        <div class="tool-head">
          <div class="tool-head-main">
            <div class="title-row">
              <h1 id="toolName">接口信息采集</h1>
              <span class="chip chip-cat" id="catChip">采集分析类</span>
            </div>
            <p class="tool-desc" id="toolDesc"></p>
          </div>
          <div class="head-actions">
            <button class="btn btn-sm" aria-label="打开结果目录"><svg class="ico ico-sm"><use href="#i-external"/></svg>结果目录</button>
            <button class="btn btn-sm" aria-label="参数模板"><svg class="ico ico-sm"><use href="#i-sliders"/></svg>参数模板</button>
          </div>
        </div>

        <div class="kpi-row" id="kpiRow"></div>

        <!-- Params -->
        <section class="card">
          <div class="card-head">
            <svg class="ico"><use href="#i-sliders"/></svg>
            <span class="card-title">运行参数</span>
            <span class="card-note" id="paramNote"></span>
            <div class="spacer"></div>
            <button class="btn btn-sm btn-ghost" id="foldBtn" aria-expanded="true">
              <svg class="ico ico-sm" style="transition:transform var(--dur-fast)" id="foldIcon"><use href="#i-chevron-down"/></svg>
              <span id="foldText">收起</span>
            </button>
          </div>

function genRows(t){
  var devices=["CORE-SW-01","ACC-H3C-07","ACC-ZTE-12","FW-FH-03","FW-DP-02","ACC-RJ-19"];
  var vendors=["华为","华三","中兴","烽火","迪普","锐捷"];
  var ips=["10.24.8.11","10.24.8.21","10.24.8.33","10.24.8.47","10.24.8.58","10.24.8.64"];
  var statuses=["成功","成功","成功","部分成功","成功","失败"];
  var reasons=["","","","字段缺失","","连接超时"];
  var out=[];
  for(var i=0;i<6;i++){
    out.push(t.columns.map(function(c){
      if(c==="状态")return statuses[i];
      if(c==="失败原因")return reasons[i];
      if(c==="IP")return ips[i];
      if(c==="设备名"||c==="设备名称"||c==="文件名")return c==="文件名"?("session-"+devices[i]+".ini"):devices[i];
      if(c==="厂商")return vendors[i];
      if(c.indexOf("耗时")>=0)return ["1,284","986","2,410","1,872","—","1,043"][i];
      if(c.indexOf("字符数")>=0||c.indexOf("文件大小")>=0)return ["42,918","38,204","28,661","35,117","—","39,880"][i];
      if(c.indexOf("CRC")>=0||c.indexOf("值")>=0)return ["6,574,201","842,660","128,904","14,208","0","—"][i];
      if(c==="接口"||c==="接口名称"||c==="本地接口")return ["cgei-0/1/1/49","GE1/0/24","gei-1/2","eth-0/3","eth1/1","Gi0/0/12"][i];
      if(c==="行号")return String(i+1).padStart(3,"0");
      if(c==="修改项数")return String(i+1);
      if(c==="说明"||c==="详情"||c==="检查项"||c==="接口描述")return ["接口描述合规","SNMP 配置缺失","描述含保留字","VRRP 网关","管理口","聚合口"][i];
      if(c==="原始输入"||c==="地址段"||c==="CIDR格式"||c==="网络地址")return "10.24."+(i+8)+".0/24";
      if(c==="Username")return "netops";
      if(c==="Hostname")return ips[i];
      if(c==="旧值"||c==="新值")return ips[i];
      if(c==="网关")return "10.24."+(i+8)+".1";
      if(c.indexOf("版本")>=0)return "IPv4";
      if(c==="备注"||c==="网关类型")return i===0?"持续增长":"";
      return "—";
    }));
  }
  return out;
}

function statusCell(v){
  var cls=STATUS_CLASS[v]||(/失败|超时|错误/.test(v)?"st-fail":"st-idle");
  return '<span class="status-chip '+cls+'">'+esc(v)+'</span>';
}
function tableRowsOf(t){
  return rowsOf(t).filter(function(r){
    if(state.filter==="ok")return r.some(function(c){return c==="成功"});
    if(state.filter==="fail")return r.some(function(c){return /失败|超时|部分成功/.test(String(c))});
    return true;
  }).filter(function(r){
    if(!state.rowSearch)return true;
    return r.join(" ").toLowerCase().indexOf(state.rowSearch.toLowerCase())>=0;
  });
}
function tableBodyOf(t,rows){
  if(!rows.length)return '<tr class="empty-row"><td colspan="'+t.columns.length+'">没有符合条件的记录</td></tr>';
  return rows.map(function(r){
    var fail=r.some(function(c){return /^(失败|连接超时|认证失败|解析失败|结果写入失败|未知错误)$/.test(String(c))});
    var cols=r.map(function(c,i){
      var col=t.columns[i]||"",s=String(c);
      var cls=(/耗时|字符数|文件大小|CRC|值|数|行号|地址/.test(col)?"num":"");
      var val=esc(c);
      if(col==="状态"||col==="检查项"&&STATUS_CLASS[s])val=statusCell(s);
      else if(/^CRC差值$/.test(col)&&/^[+-]/.test(s))val='<span class="'+(s.charAt(0)==="+"?"pos":"neg")+'">'+esc(s)+'</span>';
      else if(col==="IP"||col==="CIDR格式"||col==="网络地址"||col==="地址段"||col.indexOf("接口")>=0||col==="设备名"||col==="文件名")val='<span class="mono">'+esc(c)+'</span>';
      else if(col==="失败原因"&&s)val='<span style="color:var(--danger)">'+esc(c)+'</span>';
      return '<td class="'+cls+'">'+val+'</td>';
    }).join("");
    return '<tr class="'+(fail?"fail":"")+'">'+cols+'</tr>';
  }).join("");
}

  $("#progressNum").textContent=state.running?(Math.round(state.progress)+"%"):(state.finished?"100%":(state.cancelled?Math.round(state.progress)+"%":"待运行"));
  $("#progressItem").textContent=state.running?("当前：10.24.8."+(11+Math.floor(state.progress/8))+"  CORE-SW-0"+(1+Math.floor(state.progress/20)))
    :(state.finished?"231 成功 / 12 失败 · 02:35":(state.cancelled?"用户主动中止":"尚未启动任务"));
}

function renderAll(){renderNav();renderHead();renderKpi();renderParams();renderTabs();renderState()}

/* ============================================================
   Interactions
   ============================================================ */
document.addEventListener("click",function(e){
  var nav=e.target.closest("[data-tool]");
  if(nav){
    if(state.running){return}
    state.toolId=nav.getAttribute("data-tool");
    state.filter="all";state.rowSearch="";state.finished=false;state.cancelled=false;state.progress=0;
    renderAll();return;
  }
  var tab=e.target.closest("[data-tab]");
  if(tab){state.tab=tab.getAttribute("data-tab");renderTabs();return}
  var seg=e.target.closest("[data-filter]");
  if(seg){state.filter=seg.getAttribute("data-filter");updateTable();return}
  var f=e.target.closest("[data-font]");
  if(f){state.fontStep=Math.max(-3,Math.min(6,state.fontStep+Number(f.getAttribute("data-font"))));
    updateTable();return}
});

$("#navSearch").addEventListener("input",function(e){state.navSearch=e.target.value.trim();renderNav()});
$("#navSearch").addEventListener("keydown",function(e){if(e.key==="Escape"){e.target.value="";state.navSearch="";renderNav()}});
document.addEventListener("input",function(e){
  if(e.target.id==="rowSearch"){state.rowSearch=e.target.value;updateTable()}
});
document.addEventListener("keydown",function(e){
  if(e.key==="/"&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="SELECT"){
    e.preventDefault();$("#navSearch").focus()}
});

$("#foldBtn").addEventListener("click",function(){
  state.folded=!state.folded;
  $("#paramsBody").classList.toggle("folded",state.folded);
  $("#foldText").textContent=state.folded?"展开":"收起";
  $("#foldIcon").style.transform=state.folded?"rotate(-90deg)":"rotate(0deg)";
  this.setAttribute("aria-expanded",String(!state.folded));
});

$("#startBtn").addEventListener("click",function(){
  if(state.running)return;
  state.running=true;state.finished=false;state.cancelled=false;state.progress=0;
  renderState();
  clearInterval(state.timer);
  state.timer=setInterval(function(){
    state.progress=Math.min(100,state.progress+2+Math.random()*4);
    renderState();
    if(state.progress>=100){
      clearInterval(state.timer);state.running=false;state.finished=true;renderState();
    }
  },110);
});
$("#cancelBtn").addEventListener("click",function(){
  if(!state.running)return;
  clearInterval(state.timer);state.running=false;state.cancelled=true;renderState();
});

/* Theme */
function setTheme(v){
  state.theme=v;document.documentElement.setAttribute("data-theme",v);
  $("#themeIcon").innerHTML='<use href="#'+(v==="dark"?"i-sun":"i-moon")+'"/>';
  $("#themeBtn").setAttribute("aria-pressed",String(v==="dark"));
  try{localStorage.setItem("netops-theme",v)}catch(err){}
}
$("#themeBtn").addEventListener("click",function(){setTheme(state.theme==="dark"?"light":"dark")});
var qTheme=null;
try{qTheme=new URLSearchParams(location.search).get("theme")}catch(err){}
var initial=(qTheme==="light"||qTheme==="dark")?qTheme:null;
if(!initial){try{initial=localStorage.getItem("netops-theme")}catch(err){}}
setTheme(initial==="light"?"light":"dark");

renderAll();
</script>
</body>
</html>
